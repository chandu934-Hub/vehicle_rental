spring.application.name=vehicle-rental-system

# Optional config import for .env files
spring.config.import=optional:file:.env[.properties]

# Primary MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}

# Frontend Connection & CORS Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.onrender.com}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}