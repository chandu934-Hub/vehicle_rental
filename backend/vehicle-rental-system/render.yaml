services:
  - type: web
    name: roam-rentals-backend
    env: java
    plan: free
    region: oregon
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/vehicle-rental-system-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://vehicle-rental-two-pi.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://vehicle-rental-two-pi.vercel.app,https://*.vercel.app,https://*.onrender.com,http://localhost:5173,http://localhost:*
      - key: JWT_SECRET
        generateValue: true
